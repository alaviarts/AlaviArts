name: Render Profile Motion Hero

on:
  push:
    branches: [main]
    paths:
      - "tools/render_profile_hero.py"
      - ".github/workflows/render-profile-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering tools
        run: |
          python -m pip install --disable-pip-version-check "Pillow==12.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter || true
      - name: Render accessible animated GIF
        run: python tools/render_profile_hero.py
      - name: Publish rendered asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ali-alavi-hero-motion-v2.gif
          if git diff --cached --quiet; then
            echo "Generated hero is unchanged"
          else
            git commit -m "Render profile motion hero GIF"
            git push origin HEAD:main
          fi
